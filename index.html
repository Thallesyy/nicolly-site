<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pra Nicolly 💖</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    background: #1e1e2f;
    font-family: Arial, sans-serif;
}

.container {
    text-align: center;
    margin-top: 50px;
}

h1 {
    color: pink;
    font-size: 40px;
    margin-bottom: 20px;
}

.heart {
    width: 120px;
    height: 120px;
    background: pink;
    position: relative;
    transform: rotate(-45deg);
    margin: 40px auto;

    animation: beat 1s infinite;
    box-shadow: 0 0 25px pink;
}

.heart::before,
.heart::after {
    content: "";
    width: 120px;
    height: 120px;
    background: pink;
    border-radius: 50%;
    position: absolute;
}

.heart::before {
    top: -60px;
    left: 0;
}

.heart::after {
    left: 60px;
    top: 0;
}

@keyframes beat {
    0% { transform: rotate(-45deg) scale(1); }
    50% { transform: rotate(-45deg) scale(1.1); }
    100% { transform: rotate(-45deg) scale(1); }
}

.heart:hover {
    box-shadow: 0 0 40px pink;
}


.fireflies {
    position: absolute;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

.fireflies span {
    position: absolute;
    width: 6px;
    height: 6px;
    background: pink;
    border-radius: 50%;
    box-shadow: 0 0 10px pink, 0 0 20px pink;
    animation: float 6s linear infinite, blink 2s ease-in-out infinite;
}

.fireflies span:nth-child(1) { left: 20%; animation-duration: 5s; }
.fireflies span:nth-child(2) { left: 40%; animation-duration: 7s; }
.fireflies span:nth-child(3) { left: 60%; animation-duration: 6s; }
.fireflies span:nth-child(4) { left: 80%; animation-duration: 8s; }
.fireflies span:nth-child(5) { left: 50%; animation-duration: 5.5s; }

@keyframes float {
    0% { transform: translateY(100vh); opacity: 0; }
    50% { opacity: 1; }
    100% { transform: translateY(-10vh); opacity: 0; }
}

@keyframes blink {
    0%, 100% { opacity: 0.2; }
    50% { opacity: 1; }
}


button {
    margin-top: 20px;
    background: pink;
    color: #1e1e2f;
    border: none;
    padding: 12px 20px;
    border-radius: 20px;
    cursor: pointer;
    box-shadow: 0 0 15px pink;
    font-weight: bold;
}


.carta {
    display: none;
    margin-top: 20px;
    padding: 20px;
    background: white;
    color: #1e1e2f;
    border-radius: 15px;
    width: 260px;
    margin-left: auto;
    margin-right: auto;
    box-shadow: 0 0 20px pink;
    animation: aparecer 1s ease;
}

@keyframes aparecer {
    from { opacity: 0; transform: scale(0.8); }
    to { opacity: 1; transform: scale(1); }
}
</style>
</head>

<body>


<div class="fireflies">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
</div>

<div class="container">
    <h1>Nicolly 💖</h1>

    <div class="heart"></div>

    <button onclick="abrir()">Surpresa vida? 💌</button>

    <div class="carta" id="carta">
        <p>
        Eu fiz isso aqui pensando em ti<br><br>
        E pq eu queria ganhar uns pontos tambem<br>
        E claro eu ainda vou te pagar um açaí<br><br>
         (gostou que eu botei no melhor momento da musica?)<br><br>
        Só queria te fazer sorrir  
        </p>
    </div>
</div>


<audio id="musica" loop>
    <source src="pyramids.mp3" type="audio/mpeg">
</audio>

<script>
function abrir() {
    document.getElementById("carta").style.display = "block";

    let audio = document.getElementById("musica");
    audio.currentTime = 268; // 4:28
    audio.play();
}
</script>

</body>
</html>
