<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pra Nicolly 💖</title>

<style>
  :root{
    --pink:#ff7ac8;
    --pink2:#ffb3de;
    --bg1:#050512;
    --bg2:#14143a;
    --bg3:#080815;
  }

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    font-family: Arial, sans-serif;
    color:white;

    overflow-x:hidden;
    overflow-y:auto;

    background:
      radial-gradient(900px 500px at 20% 10%, rgba(255,122,200,0.18), transparent 60%),
      radial-gradient(700px 400px at 80% 20%, rgba(120,160,255,0.14), transparent 60%),
      radial-gradient(900px 700px at 50% 110%, rgba(0,0,0,0.55), transparent 55%),
      linear-gradient(180deg, var(--bg2), var(--bg1) 55%, var(--bg3));
  }

  body::after{
    content:"";
    position:fixed;
    inset:-40px;
    pointer-events:none;
    background: radial-gradient(closest-side, transparent 55%, rgba(0,0,0,0.55) 100%);
    z-index: 1;
  }

  .stars{
    position:fixed;
    inset:0;
    background: radial-gradient(white 1px, transparent 1px);
    background-size: 22px 22px;
    animation: starsMove 60s linear infinite;
    opacity:.22;
    pointer-events:none;
    z-index:0;
  }
  @keyframes starsMove{ from{transform:translateY(0)} to{transform:translateY(-100px)} }

  .glow{
    position:fixed;
    inset:-20%;
    pointer-events:none;
    z-index:0;
    background:
      radial-gradient(circle at 30% 30%, rgba(255,122,200,0.12), transparent 40%),
      radial-gradient(circle at 70% 40%, rgba(120,160,255,0.10), transparent 45%),
      radial-gradient(circle at 50% 70%, rgba(255,179,222,0.10), transparent 45%);
    filter: blur(8px);
  }

  .fireflies{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;
  }
  .fireflies span{
    position:absolute;
    bottom:-10vh;
    width:6px; height:6px;
    border-radius:50%;
    background: rgba(255,122,200,0.9);
    box-shadow: 0 0 10px rgba(255,122,200,0.9), 0 0 22px rgba(255,122,200,0.55);
    animation: floatUp linear infinite, blink 2s ease-in-out infinite;
    opacity:0;
  }
  .fireflies span:nth-child(1){ left:12%; animation-duration:6.5s; animation-delay:0s; }
  .fireflies span:nth-child(2){ left:25%; animation-duration:8s; animation-delay:1s; width:5px; height:5px; }
  .fireflies span:nth-child(3){ left:40%; animation-duration:7s; animation-delay:.2s; }
  .fireflies span:nth-child(4){ left:55%; animation-duration:9s; animation-delay:1.7s; width:7px; height:7px; }
  .fireflies span:nth-child(5){ left:70%; animation-duration:7.5s; animation-delay:.9s; }
  .fireflies span:nth-child(6){ left:82%; animation-duration:10s; animation-delay:2.2s; width:5px; height:5px; }
  .fireflies span:nth-child(7){ left:92%; animation-duration:8.5s; animation-delay:1.3s; }

  @keyframes floatUp{
    0%{ transform:translateY(0) translateX(0); opacity:0; }
    10%{ opacity:.9; }
    50%{ transform:translateY(-55vh) translateX(18px); opacity:.7; }
    100%{ transform:translateY(-115vh) translateX(-12px); opacity:0; }
  }
  @keyframes blink{ 0%,100%{opacity:.15} 50%{opacity:1} }

  
  .container{
    text-align:center;
    margin-top: 18px;
    padding: 0 14px 110px;
    z-index:2;
    position:relative;
    width: min(520px, 94vw);

    display:flex;
    flex-direction:column;
    align-items:center;
    gap: 18px;
  }

  h1{
    color: var(--pink2);
    margin:0;
    text-shadow: 0 0 18px rgba(255,122,200,0.25);
  }

  
  .container h1{
    position: sticky;
    top: 0;
    z-index: 1200;
    padding: 10px 12px 8px;
    background: linear-gradient(
      180deg,
      rgba(5,5,18,0.95),
      rgba(5,5,18,0.55),
      rgba(5,5,18,0)
    );
    backdrop-filter: blur(6px);
  }

  .envelope{
    font-size:60px;
    cursor:pointer;
    transition:.3s;
    user-select:none;
    filter: drop-shadow(0 0 14px rgba(255,122,200,0.22));
  }
  .envelope:hover{ transform:scale(1.2); }
  .sumiu{ display:none !important; }

  .step{ display:none; }
  .step.show{ display:block; }

  .heart{
    width:120px; height:120px;
    background: var(--pink);
    position:relative;
    margin: 0;
    cursor:pointer;
    user-select:none;

    --s:1;
    transform: rotate(-45deg) scale(var(--s));
    animation: beat 1s infinite;
    will-change: transform;

    box-shadow: 0 0 30px rgba(255,122,200,0.8), 0 0 70px rgba(255,122,200,0.35);
  }
  .heart:hover{ --s:1.12; filter: brightness(1.05); }
  .heart::before,.heart::after{
    content:"";
    width:120px; height:120px;
    background: var(--pink);
    border-radius:50%;
    position:absolute;
  }
  .heart::before{ top:-60px; left:0; }
  .heart::after{ top:0; left:60px; }

  @keyframes beat{
    0%{ transform: rotate(-45deg) scale(calc(var(--s) * 1)); }
    50%{ transform: rotate(-45deg) scale(calc(var(--s) * 1.15)); }
    100%{ transform: rotate(-45deg) scale(calc(var(--s) * 1)); }
  }
  .batida-forte{ animation: beatStrong .5s infinite; }
  @keyframes beatStrong{
    0%{ transform: rotate(-45deg) scale(calc(var(--s) * 1.05)); }
    50%{ transform: rotate(-45deg) scale(calc(var(--s) * 1.30)); }
    100%{ transform: rotate(-45deg) scale(calc(var(--s) * 1.05)); }
  }

  .carta{
    background: rgba(255,255,255,0.95);
    padding:20px;
    border-radius:15px;
    width: min(340px, 92vw);
    margin-top: 16px;
    box-shadow: 0 0 25px rgba(255,122,200,0.35);
    color:#222;
  }

  .galeria{
    margin-top: 6px;
    display:flex;
    flex-wrap: wrap;
    gap:10px;
    justify-content:center;
  }
  .foto{
    width:86px;
    height:86px;
    object-fit:cover;
    border-radius:12px;
    cursor:pointer;
    transition:.25s;
    user-select:none;
    box-shadow: 0 0 18px rgba(255,122,200,0.18);
  }
  .foto:hover{ transform:scale(1.12); }

  
  #popup{
    display:none;
    position:fixed;
    inset:0;
    background: rgba(0,0,0,0.95);
    justify-content:center;
    align-items:center;
    z-index: 9999;
    padding: 24px;
    box-sizing:border-box;
  }
  #popup img{
    max-width: 92%;
    max-height: 82vh;
    border-radius: 15px;
    box-shadow: 0 0 30px rgba(255,122,200,0.55);
  }


  #slideshow{
  display:none;
  position:fixed;
  inset:0;
  background: rgba(0,0,0,0.92);
  z-index: 9998;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap: 12px;
  padding: 18px;
  box-sizing:border-box;
}

#slideshow.show{ display:flex; }

#slideshow img{
  width: min(520px, 92vw);
  height: min(72vh, 520px);
  object-fit: contain;
  border-radius: 16px;
  box-shadow: 0 0 34px rgba(255,122,200,0.25);
  opacity: 1;
  transition: opacity 220ms ease;
}


#slideshow img.fade-out{
  opacity: 0;
}

#slideHint{
  font-weight: 800;
  color: var(--pink2);
  opacity: .9;
  text-shadow: 0 0 18px rgba(255,122,200,0.18);
}


#slideMeta{
  width: min(520px, 92vw);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap: 10px;
  color: rgba(255,255,255,0.85);
  font-weight: 800;
  font-size: 12px;
}

#slideBar{
  width: min(520px, 92vw);
  height: 8px;
  border-radius: 999px;
  background: rgba(255,255,255,0.12);
  overflow:hidden;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
}

#slideBarFill{
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, rgba(255,122,200,0.95), rgba(255,179,222,0.95));
  border-radius: 999px;
  transition: width 220ms ease;
}

  .final{
    margin-top:10px;
    position:relative;
    width: 100%;
  }
  .final p{
    margin: 10px 0 6px;
    color: var(--pink2);
    text-shadow: 0 0 18px rgba(255,122,200,0.22);
    font-size: clamp(18px, 5vw, 22px);
    padding: 0 10px;
    word-break: break-word;
  }
  .final-actions{
    position:relative;
    min-height: 90px;
  }
  .final-actions > button{
    background: var(--pink2);
    border:none;
    padding:10px 14px;
    margin:5px;
    cursor:pointer;
    border-radius:10px;
    font-weight:900;
  }
  .foge{
    position:absolute;
    left:50%;
    transform: translateX(-50%);
    top:48px;
    white-space: nowrap;
  }

  
  #btnSim{
    transition: transform .18s ease, box-shadow .18s ease;
  }
  #btnSim.buff{
    transform: scale(1.18);
    box-shadow: 0 0 18px rgba(255,122,200,0.35);
  }

  
  #musicWrap{ display: contents; } 

  .music-float{
    position: fixed;
    z-index: 50;
    width: 230px;
    display:none;
  }
  .music-float.show{ display:block; }

  .music-card{
    background: rgba(255,255,255,0.10);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 16px;
    padding: 10px;
    box-shadow: 0 0 26px rgba(255,122,200,0.10);
    backdrop-filter: blur(7px);
  }
  .music-title{
    margin: 0 0 10px;
    text-align: center;
    color: var(--pink2);
    font-weight: 900;
    text-shadow: 0 0 18px rgba(255,122,200,0.18);
  }
  .track-mini{
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px;
    border-radius: 14px;
    background: rgba(0,0,0,0.22);
    border: 1px solid rgba(255,255,255,0.08);
  }
  .track-mini img{
    width: 46px;
    height: 46px;
    border-radius: 12px;
    object-fit: cover;
    box-shadow: 0 0 16px rgba(255,122,200,0.16);
  }
  .track-mini .meta{
    flex: 1;
    line-height: 1.1;
    text-align: left;
    min-width: 0;
  }
  .track-mini .name{
    margin: 0;
    font-size: 13px;
    font-weight: 900;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .track-mini .artist{
    margin: 4px 0 0;
    font-size: 11px;
    opacity: 0.8;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .track-mini button{
    background: var(--pink2);
    border: none;
    border-radius: 12px;
    padding: 8px 12px;
    font-weight: 900;
    cursor: pointer;
    min-width: 64px;
  }

  .pos-m1{ left: 22px; top: 150px; }
  .pos-m2{ left: 22px; bottom: 110px; }
  .pos-m3{ right: 22px; top: 150px; }

  
  @media (max-width: 860px){
    #musicWrap{
      position: sticky;
      top: 0;
      z-index: 1400;
      display: none;
      gap: 12px;
      padding: 10px 12px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scroll-snap-type: x mandatory;
      background: rgba(0,0,0,0.18);
      backdrop-filter: blur(6px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    #musicWrap.show{ display:flex; }

    .music-float{
      position: static !important;
      width: 260px;
      flex: 0 0 auto;
      scroll-snap-align: start;
      display: block;
    }
    .pos-m1,.pos-m2,.pos-m3{ left:auto; right:auto; top:auto; bottom:auto; }
  }

  
  #musicaGlobal{
    position: fixed;
    left:-9999px;
    top:-9999px;
    opacity:0;
    pointer-events:none;
  }

  @media (max-width: 520px){
    .container{ gap: 14px; }
    .heart{ width: 96px; height: 96px; }
    .heart::before,.heart::after{ width: 96px; height: 96px; }
    .heart::before{ top: -48px; left: 0; }
    .heart::after{ top: 0; left: 48px; }
  }
</style>
</head>

<body>
  <div class="stars"></div>
  <div class="glow"></div>

  <div class="fireflies" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
  </div>

  
  <div id="musicWrap">
    <div class="music-float pos-m1" id="m1">
      <div class="music-card">
        <p class="music-title">Música 1</p>
        <div class="track-mini" data-src="pyramids.mp3" data-start="268">
          <img src="capa1.jpg" alt="Capa música 1">
          <div class="meta">
            <p class="name">Pyramids</p>
            <p class="artist">Frank Ocean</p>
          </div>
          <button type="button" onclick="toggleTrack(this)">Play</button>
        </div>
      </div>
    </div>

    <div class="music-float pos-m2" id="m2">
      <div class="music-card">
        <p class="music-title">Música 2</p>
        <div class="track-mini" data-src="Love_drought.mp3" data-start="170">
          <img src="capa2.jpg" alt="Capa música 2">
          <div class="meta">
            <p class="name">Love Drought</p>
            <p class="artist">Beyoncé</p>
          </div>
          <button type="button" onclick="toggleTrack(this)">Play</button>
        </div>
      </div>
    </div>

    <div class="music-float pos-m3" id="m3">
      <div class="music-card">
        <p class="music-title">Música 3</p>
        <div class="track-mini" data-src="Best_part.mp3" data-start="50">
          <img src="capa3.jpg" alt="Capa música 3">
          <div class="meta">
            <p class="name">Best Part</p>
            <p class="artist">Daniel Caesar</p>
          </div>
          <button type="button" onclick="toggleTrack(this)">Play</button>
        </div>
      </div>
    </div>
  </div>

  <div class="container">
    <h1>Nicolly 💖</h1>

    <div class="envelope" id="envelope" onclick="abrirCarta()">💌</div>

    
    <div class="step" id="step-heart">
      <div class="heart" onclick="explodir()"></div>
    </div>

   
    <div class="step" id="step-text">
      <div class="carta">
        <p id="texto"></p>
      </div>
    </div>

    
    <div class="step" id="step-photos">
      <div class="galeria">
        <img src="foto1.jpg" class="foto" onclick="abrirFoto(this)" alt="Foto 1">
        <img src="foto2.jpg" class="foto" onclick="abrirFoto(this)" alt="Foto 2">
        <img src="foto3.jpg" class="foto" onclick="abrirFoto(this)" alt="Foto 3">
        <img src="foto4.jpg" class="foto" onclick="abrirFoto(this)" alt="Foto 4">
      </div>

      <div class="final">
        <p>Te ganhei né?</p>
        <div class="final-actions">
          <button id="btnSim" onclick="alert('sabia ')">Sim</button>
          <button class="foge" onmouseover="fugir(this)" ontouchstart="buffSim()">Não né</button>
        </div>
      </div>
    </div>
  </div>

  
  <div id="slideshow" onclick="proximaFoto()">
  <div id="slideMeta">
    <div id="slideCount">Foto 1 de 4</div>
    <div id="slideNow">Toque para passar</div>
  </div>

  <div id="slideBar">
    <div id="slideBarFill"></div>
  </div>

  <img id="slideImg" alt="Foto">
  <div id="slideHint">Toque para passar</div>
</div>

  
  <div id="popup" onclick="fecharFoto()">
    <img id="imgPopup" alt="Foto ampliada">
  </div>

  <audio id="musicaGlobal" preload="auto"></audio>

<script>
 
  const audio = document.getElementById("musicaGlobal");
  let currentTrackEl = null;

  function setAllButtonsToPlay(){
    document.querySelectorAll(".track-mini button").forEach(b => b.textContent = "Play");
  }

  function toggleTrack(btn){
    const track = btn.closest(".track-mini");
    const src = track.dataset.src;
    const start = Number(track.dataset.start || 0);
    const isSame = (currentTrackEl === track);

    if (isSame && !audio.paused){
      audio.pause();
      btn.textContent = "Play";
      return;
    }

    currentTrackEl = track;
    setAllButtonsToPlay();
    btn.textContent = "Pause";

    audio.src = src;
    audio.load();

    const onMeta = () => {
      audio.currentTime = start;
      audio.play().catch(() => {
        btn.textContent = "Play";
      });
      audio.removeEventListener("loadedmetadata", onMeta);
    };
    audio.addEventListener("loadedmetadata", onMeta);
  }

  audio.addEventListener("ended", () => {
    setAllButtonsToPlay();
    currentTrackEl = null;
  });

  audio.addEventListener("pause", () => {
    if (currentTrackEl){
      const b = currentTrackEl.querySelector("button");
      if (b) b.textContent = "Play";
    }
  });

  
  function buffSim(){
    const b = document.getElementById("btnSim");
    if (!b) return;
    b.classList.add("buff");
    setTimeout(() => b.classList.remove("buff"), 250);
  }


  const fotos = ["foto1.jpg","foto2.jpg","foto3.jpg","foto4.jpg"];
let slideIndex = 0;

function atualizarUIFoto(){
  const total = fotos.length;
  const atual = slideIndex + 1;

  const countEl = document.getElementById("slideCount");
  const barEl = document.getElementById("slideBarFill");

  if (countEl) countEl.textContent = `Foto ${atual} de ${total}`;
  if (barEl) barEl.style.width = `${(atual / total) * 100}%`;
}

function trocarImagemComFade(novaSrc, onDone){
  const img = document.getElementById("slideImg");
  if (!img) return;

  img.classList.add("fade-out");

  setTimeout(() => {
    img.src = novaSrc;

    
    img.onload = () => {
      img.classList.remove("fade-out");
      if (onDone) onDone();
    };

  
    setTimeout(() => {
      img.classList.remove("fade-out");
      if (onDone) onDone();
    }, 200);
  }, 180);
}

function iniciarSlideshow(){
  slideIndex = 0;
  document.getElementById("slideshow").classList.add("show");

  atualizarUIFoto();
  const primeira = fotos[slideIndex];
  const img = document.getElementById("slideImg");
  img.src = primeira;
  img.classList.remove("fade-out");
}

function proximaFoto(){
  slideIndex++;

  if (slideIndex < fotos.length){
    atualizarUIFoto();
    trocarImagemComFade(fotos[slideIndex]);
  } else {
    document.getElementById("slideshow").classList.remove("show");

    document.getElementById("step-photos").classList.add("show");
    document.getElementById("step-photos").scrollIntoView({behavior:"smooth", block:"center"});

    setTimeout(() => {
      document.getElementById("musicWrap").classList.add("show");
      document.getElementById("m1").classList.add("show");
      document.getElementById("m2").classList.add("show");
      document.getElementById("m3").classList.add("show");
    }, 500);
  }
}

  
  function abrirCarta() {
    document.getElementById("envelope").classList.add("sumiu");

  
    document.getElementById("step-heart").classList.add("show");
    document.querySelector(".heart").classList.add("batida-forte");

  
    tocarAleatoria();

   
    setTimeout(() => {
      document.getElementById("step-text").classList.add("show");
      digitarTexto(() => {
       
        setTimeout(() => iniciarSlideshow(), 350);
      });
    }, 550);
  }

  function digitarTexto(onDone){
    const textoElemento = document.getElementById("texto");
    textoElemento.innerHTML = "";
    const texto = "Fala a verdade tu ta rindo que nem uma idiota agora ne";
    let i = 0;

    function escrever(){
      if (i < texto.length){
        textoElemento.innerHTML += texto.charAt(i);
        i++;
        setTimeout(escrever, 40);
      } else {
        if (onDone) onDone();
      }
    }
    escrever();
  }

  function tocarAleatoria(){
    const tracks = Array.from(document.querySelectorAll(".track-mini"));
    const random = tracks[Math.floor(Math.random() * tracks.length)];
    if (!random) return;

    const btn = random.querySelector("button");
    if (btn) toggleTrack(btn);

    
    const retry = () => {
      if (audio.paused && btn) toggleTrack(btn);
    };
    window.addEventListener("pointerdown", retry, { once: true });
    window.addEventListener("touchstart", retry, { once: true });
  }


  function abrirFoto(img) {
    const popup = document.getElementById("popup");
    popup.style.display = "flex";
    document.getElementById("imgPopup").src = img.src;
  }
  function fecharFoto() {
    document.getElementById("popup").style.display = "none";
  }


  function fugir(btn) {
    buffSim();

    const padding = 20;
    const maxTop = Math.max(padding, window.innerHeight - btn.offsetHeight - padding);
    const maxLeft = Math.max(padding, window.innerWidth - btn.offsetWidth - padding);

    btn.style.top = (Math.random() * (maxTop - padding) + padding) + "px";
    btn.style.left = (Math.random() * (maxLeft - padding) + padding) + "px";
    btn.style.transform = "none";
  }

  function explodir() {
    alert("Tu é a pessoa mais maravilhosa que eu ja conheci");
  }
</script>
</body>
</html>
